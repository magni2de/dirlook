name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: macos-arm64
            os: macos-14
          - target: x86_64-apple-darwin
            label: macos-x86_64
            os: macos-14
          - target: x86_64-unknown-linux-musl
            label: linux-x86_64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            label: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="dirlook-${tag}-${{ matrix.label }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/dirlook" "dist/${name}/"
          (cd dist && tar czf "${name}.tar.gz" "${name}")
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
